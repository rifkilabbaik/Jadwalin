<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block judul %}Prospek{% endblock %} · Pesanin</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍗</text></svg>">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-stone-100 text-stone-800 min-h-screen antialiased">
  <header class="bg-white border-b border-stone-200 sticky top-0 z-20">
    <div class="max-w-5xl mx-auto px-4 flex items-center gap-3 h-14">
      <a href="/" class="font-bold text-lg text-orange-600 shrink-0">🍗 Pesanin</a>
      <nav class="flex gap-1 overflow-x-auto text-sm -mr-4 pr-4">
        {% set menu = [("/", "Prospek", "prospek"), ("/tambah", "Tambah", "tambah")] %}
        {% for url, label, kunci in menu %}
        <a href="{{ url }}"
           class="px-3 py-1.5 rounded-lg whitespace-nowrap {{ 'bg-orange-100 text-orange-800 font-medium' if halaman == kunci else 'text-stone-600 hover:bg-stone-100' }}">{{ label }}</a>
        {% endfor %}
      </nav>
    </div>
  </header>

  <main class="max-w-5xl mx-auto px-4 py-5">
    {% if pesan %}
    <div class="mb-4 rounded-lg px-4 py-3 text-sm {{ 'bg-red-50 text-red-800 border border-red-200' if jenis_pesan == 'galat' else 'bg-emerald-50 text-emerald-800 border border-emerald-200' }}">
      {{ pesan }}
    </div>
    {% endif %}
    {% block isi %}{% endblock %}
  </main>

  <div id="toast" class="fixed bottom-4 left-1/2 -translate-x-1/2 z-50 hidden max-w-sm w-[calc(100%-2rem)] rounded-xl bg-stone-900 text-white text-sm px-4 py-3 shadow-lg"></div>
  <script src="/static/app.js"></script>
</body>
</html>
