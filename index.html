<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#F2F6F5" />
  <meta name="description" content="Jadwalin — agenda kegiatan toko" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Jadwalin" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <title>Jadwalin</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" type="image/svg+xml" href="icons/icon.svg" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600&family=Nunito:wght@400;700;800&display=swap" />
  <link rel="stylesheet" href="css/style.css" />
  <script>
    (function () {
      try {
        var t = localStorage.getItem('jw_theme'), p = localStorage.getItem('jw_palette');
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
        if (p === 'lavender' || p === 'peach') document.documentElement.dataset.palette = p;
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
      <symbol id="i-minus" viewBox="0 0 24 24"><path d="M5 12h14"/></symbol>
      <symbol id="i-filter" viewBox="0 0 24 24"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2.2"/><circle cx="9" cy="17" r="2.2"/></symbol>
      <symbol id="i-gear" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83 0 2 2 0 010-2.83l.06-.06a1.65 1.65 0 00.33-1.82 1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 010-2.83 2 2 0 012.83 0l.06.06a1.65 1.65 0 001.82.33H9a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 0 2 2 0 010 2.83l-.06.06a1.65 1.65 0 00-.33 1.82V9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/></symbol>
      <symbol id="i-chev-l" viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></symbol>
      <symbol id="i-chev-r" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></symbol>
      <symbol id="i-chev-d" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></symbol>
      <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></symbol>
      <symbol id="i-x" viewBox="0 0 24 24"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/></symbol>
      <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></symbol>
      <symbol id="i-chat" viewBox="0 0 24 24"><path d="M20.5 11.6a8.4 8.4 0 01-12.3 7.4L3.5 20.5l1.5-4.5a8.4 8.4 0 1115.5-4.4z"/><path d="M9 10.2c.4 1.8 2 3.4 3.8 3.9"/></symbol>
      <symbol id="i-pencil" viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16v4z"/><path d="M13.5 6.5l4 4"/></symbol>
      <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></symbol>
      <symbol id="i-school" viewBox="0 0 24 24"><path d="M4 20V11l8-5 8 5v9"/><path d="M9.5 20v-5h5v5"/><path d="M12 6V2.5l3.5 1.5L12 5.5"/></symbol>
      <symbol id="i-people" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.2"/><circle cx="17.2" cy="9" r="2.5"/><path d="M3 19.5c0-3.3 2.7-6 6-6s6 2.7 6 6"/><path d="M15.2 13.8c.6-.2 1.3-.3 2-.3 2.6 0 4.8 2.1 4.8 4.8"/></symbol>
      <symbol id="i-heart" viewBox="0 0 24 24"><path d="M12 20s-7.5-4.6-7.5-10.2A4.3 4.3 0 0112 7.1a4.3 4.3 0 017.5 2.7C19.5 15.4 12 20 12 20z"/></symbol>
      <symbol id="i-pin" viewBox="0 0 24 24"><path d="M12 21s-6.5-5.8-6.5-11.2a6.5 6.5 0 1113 0C18.5 15.2 12 21 12 21z"/><circle cx="12" cy="9.8" r="2.3"/></symbol>
      <symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-8 8-8s8 3.6 8 8"/></symbol>
      <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></symbol>
      <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20 12a8 8 0 11-2.6-5.9"/><path d="M20 4v5h-5"/></symbol>
      <symbol id="i-cal" viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15.5" rx="4"/><path d="M3.5 10h17M8.5 3v4M15.5 3v4"/></symbol>
      <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4 4"/></symbol>
      <symbol id="i-tag" viewBox="0 0 24 24"><path d="M3.5 12.5V5a1.5 1.5 0 011.5-1.5h7.5l8 8-9 9-8-8z"/><circle cx="8.5" cy="8.5" r="1.6"/></symbol>
      <symbol id="i-kid" viewBox="0 0 24 24"><circle cx="12" cy="5" r="3.2" style="fill:currentColor;stroke:none"/><path d="M12 9.3c-1.3 0-2.3.4-3-.3L5.3 4.2c-.8-1-2.4 0-1.8 1.2l3.8 6.1c.5.8.8 1.7.8 2.7v5.6c0 1.3 1.1 2.4 2.4 2.4h3c1.3 0 2.4-1.1 2.4-2.4v-5.6c0-1 .3-1.9.8-2.7l3.8-6.1c.6-1.2-1-2.2-1.8-1.2L15 9c-.7.7-1.7.3-3 .3z" style="fill:currentColor;stroke:none"/><circle cx="10.8" cy="3.9" r="1.05" style="fill:#fff;opacity:.55;stroke:none"/><path d="M10.2 13.2v5.6" style="stroke:#fff;opacity:.4;stroke-width:1.4"/></symbol>
      <symbol id="i-list" viewBox="0 0 24 24"><path d="M9 6.5h11M9 12h11M9 17.5h11"/><circle cx="4.6" cy="6.5" r="1.2" style="fill:currentColor;stroke:none"/><circle cx="4.6" cy="12" r="1.2" style="fill:currentColor;stroke:none"/><circle cx="4.6" cy="17.5" r="1.2" style="fill:currentColor;stroke:none"/></symbol>
      <symbol id="i-star" viewBox="0 0 24 24"><path d="M12 3.5l2.6 5.3 5.9.9-4.3 4.1 1 5.8L12 16.9l-5.2 2.7 1-5.8-4.3-4.1 5.9-.9z"/></symbol>
      <symbol id="i-handshake" viewBox="0 0 24 24"><path d="M11 17l2 2a1 1 0 103-3"/><path d="M14 14l2.5 2.5a1 1 0 103-3l-3.88-3.88a3 3 0 00-4.24 0l-.88.88a1 1 0 11-3-3l2.81-2.81a5.79 5.79 0 017.06-.87l.47.28a2 2 0 001.42.25L21 4"/><path d="M21 3l1 11h-2"/><path d="M3 3L2 14l6.5 6.5a1 1 0 103-3"/><path d="M3 4h8"/></symbol>
      <symbol id="i-clipboard" viewBox="0 0 24 24"><rect x="8" y="2.5" width="8" height="4" rx="1.2"/><path d="M16 4.5h1.5a2 2 0 012 2V20a2 2 0 01-2 2h-5"/><path d="M8 4.5H6.5a2 2 0 00-2 2v7"/><path d="M10.6 12.4a1.9 1.9 0 012.7 2.7L8 20.4l-3.6.9.9-3.6z"/></symbol>
      <symbol id="i-phone" viewBox="0 0 24 24"><path d="M5 3.5h3.5l1.8 4.6-2.3 1.4a11 11 0 006 6l1.4-2.3 4.6 1.8V18.5a2 2 0 01-2 2A16.5 16.5 0 013 5.5a2 2 0 012-2z"/></symbol>
      <symbol id="i-note" viewBox="0 0 24 24"><path d="M5 3.5h10l4 4v13H5z"/><path d="M14.5 3.5v4.5H19M8.5 12h7M8.5 16h5"/></symbol>
      <symbol id="i-logo" viewBox="0 0 48 48"><rect x="4" y="9" width="40" height="35" rx="15" style="fill:var(--primary);stroke:none"/><rect x="12.5" y="3.5" width="7.5" height="12" rx="3.75" style="fill:var(--sun);stroke:none"/><rect x="28" y="3.5" width="7.5" height="12" rx="3.75" style="fill:var(--sun);stroke:none"/><path d="M16 27.5l5.5 5.5L32 22.5" style="fill:none;stroke:var(--on-primary);stroke-width:4.6;stroke-linecap:round;stroke-linejoin:round"/></symbol>
    </defs>
  </svg>

  <div class="splash" id="splash">
    <svg class="logo splash-logo" aria-hidden="true"><use href="#i-logo"/></svg>
    <div class="spinner"></div>
    <div class="splash-msg" id="splashMsg">Memuat data<span class="loading-dots"></span></div>
  </div>

  <div class="app" id="app">
    <header class="top">
      <div class="brand">
        <svg class="logo" aria-hidden="true"><use href="#i-logo"/></svg>
        <span class="wordmark">Jadwal<span>in</span></span>
      </div>
      <div class="greet">
        <div class="eyebrow" id="todayLabel"></div>
        <div class="hello" id="helloLabel">Halo!</div>
      </div>
      <button class="round" id="btnSearch" aria-label="Cari" aria-expanded="false" aria-controls="searchPop"><svg class="i"><use href="#i-search"/></svg></button>
      <button class="round" id="btnFilter" aria-label="Filter"><svg class="i"><use href="#i-filter"/></svg><span class="badge-dot" id="filterDot" hidden></span></button>
      <button class="round" id="btnSettings" aria-label="Pengaturan"><svg class="i"><use href="#i-gear"/></svg></button>
      <button class="add-btn" id="btnAdd"><svg class="i"><use href="#i-plus"/></svg>Tambah kegiatan</button>
      <div class="search-pop" id="searchPop" role="search" hidden>
        <label class="search-field">
          <svg class="i" aria-hidden="true"><use href="#i-search"/></svg>
          <input type="search" id="q" placeholder="Cari kegiatan, toko, atau PIC" autocomplete="off" aria-label="Cari kegiatan" />
          <button type="button" class="mini-round" id="qClose" aria-label="Tutup pencarian"><svg class="i"><use href="#i-x"/></svg></button>
        </label>
        <div class="search-results" id="searchResults" aria-live="polite"></div>
      </div>
    </header>

    <div class="stats" id="stats"></div>

    <div class="main" id="main">
      <section class="card cal" id="cal" aria-label="Kalender kegiatan">
        <div class="cal-head">
          <h2 class="cal-title" id="calTitle">—</h2>
          <button class="mini-round" id="calPrev" aria-label="Sebelumnya"><svg class="i"><use href="#i-chev-l"/></svg></button>
          <button class="mini-round" id="calNext" aria-label="Berikutnya"><svg class="i"><use href="#i-chev-r"/></svg></button>
        </div>
        <div class="dow" aria-hidden="true"><span>Min</span><span>Sen</span><span>Sel</span><span>Rab</span><span>Kam</span><span>Jum</span><span>Sab</span></div>
        <div class="days" id="calDays"></div>
        <div class="cal-foot">
          <div class="seg small" role="group" aria-label="Tampilan kalender" id="calMode">
            <button data-mode="bulan">Bulan</button>
            <button data-mode="minggu">Minggu</button>
          </div>
          <button class="chipbtn small" id="calToday" hidden>Hari ini</button>
          <button class="chipbtn small list-btn" id="btnList"><svg class="i"><use href="#i-list"/></svg>Daftar kegiatan</button>
        </div>
      </section>
      <div class="side" id="side"></div>
      <section class="listview" id="listView" aria-label="Daftar kegiatan" hidden></section>
    </div>
  </div>

  <button class="fab" id="fab"><svg class="i"><use href="#i-plus"/></svg>Tambah</button>

  <div class="scrim" id="scrim" hidden></div>

  <aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-labelledby="drawerTitle" hidden>
    <div class="drawer-head">
      <button class="round" id="drawerClose" aria-label="Tutup">
        <svg class="i only-phone"><use href="#i-chev-l"/></svg>
        <svg class="i only-wide"><use href="#i-x"/></svg>
      </button>
      <h2 class="drawer-title" id="drawerTitle"></h2>
      <span class="spacer"></span>
    </div>
    <div class="drawer-body" id="drawerBody"></div>
  </aside>

  <form class="dialog" id="dialog" role="dialog" aria-modal="true" aria-labelledby="dialogTitle" novalidate hidden>
    <div class="handle"></div>
    <div class="sheet-head">
      <h2 id="dialogTitle">Kegiatan baru</h2>
      <button type="button" class="round" id="dialogClose" aria-label="Tutup"><svg class="i"><use href="#i-x"/></svg></button>
    </div>
    <div class="dialog-body" id="dialogBody"></div>
  </form>

  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

  <script src="js/config.js"></script>
  <script src="js/sheets.js"></script>
  <script src="js/app.js"></script>

  <script>
    if ('serviceWorker' in navigator) {
      const hadController = !!navigator.serviceWorker.controller;
      let reloaded = false;
      navigator.serviceWorker.addEventListener('controllerchange', () => {
        if (!hadController || reloaded) return;
        reloaded = true;
        window.location.reload();
      });
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('service-worker.js')
          .then(reg => reg.update())
          .catch(() => {});
      });
    }
  </script>
</body>
</html>
